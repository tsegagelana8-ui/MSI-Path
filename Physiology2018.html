<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Physiology 2018</title>
<style>
:root{
  --bg:#0c1220; --card:#151d2d; --text:#eef3ff; --muted:#a9b3c6; --line:#2a3549;
  --primary:#2857d9; --primary2:#6d4cff; --good:#138a55; --bad:#c7354e;
  --shadow:0 14px 38px rgba(19,31,55,.10); --radius:18px;
}
[data-theme="dark"]{
  --bg:#0c1220; --card:#151d2d; --text:#eef3ff; --muted:#a9b3c6; --line:#2a3549;
  --primary:#6d8cff; --primary2:#9a7cff; --good:#43c88b; --bad:#ff6d84;
  --shadow:0 18px 48px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#080d18,#0c1220 55%,#10182a); color:var(--text);
}
[data-theme="dark"] body{background:var(--bg)}
button{font:inherit}
.app{max-width:1180px;margin:0 auto;padding:18px}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px
}
.brand{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.title{font-size:clamp(20px,4vw,30px);font-weight:850;letter-spacing:-.03em}
.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:12px;
  cursor:pointer;font-weight:700;transition:.18s transform,.18s box-shadow,.18s background
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(40,87,217,.12)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}
.btn.danger{color:#fff;background:var(--bad);border:0}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.mode{
  display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)
}
.mode button{border:0;background:transparent;padding:9px 12px;color:var(--muted);font-weight:800;cursor:pointer}
.mode button.active{background:var(--primary);color:#fff}
.dashboard{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:900px){.dashboard{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats{padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:12px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--card) 92%,var(--primary) 8%)}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted);font-weight:700}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0;transition:.3s}
.question-card{padding:22px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}
.qnum{font-size:13px;color:var(--muted);font-weight:800}
.flag{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:800}
.flag.on{color:#fff;background:#e3a31a;border-color:#e3a31a}
.question{font-size:clamp(18px,2.6vw,24px);font-weight:800;line-height:1.42;margin-bottom:18px}
.options{display:grid;gap:11px}
.option{
  position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:14px;cursor:pointer;transition:.18s ease;overflow:hidden
}
.option:hover{border-color:var(--primary);transform:translateY(-1px)}
.option.selected{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent),0 0 24px color-mix(in srgb,var(--primary) 18%,transparent)}
.option.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 15%,transparent)}
.option.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.letter{width:30px;height:30px;display:grid;place-items:center;flex:0 0 30px;border-radius:9px;background:var(--bg);font-weight:900}
.option .txt{line-height:1.45}
.feedback{margin-top:17px;padding:16px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--primary) 5%,var(--card));display:none}
.feedback.show{display:block}
.feedback h3{margin:0 0 8px;font-size:16px}
.answer-line{font-weight:900;margin-bottom:10px}
.exp{padding:9px 0;border-top:1px dashed var(--line);line-height:1.5;font-size:14px}
.exp b{display:inline-block;min-width:26px}
.explain-good{color:var(--good)} .explain-bad{color:var(--bad)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions .left,.actions .right{display:flex;gap:8px;flex-wrap:wrap}
.palette{padding:15px;position:sticky;top:92px}
.palette h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pill{
  aspect-ratio:1;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:9px;font-weight:800;cursor:pointer
}
.pill.current{outline:3px solid color-mix(in srgb,var(--primary) 25%,transparent);border-color:var(--primary)}
.pill.answered{background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.pill.flagged{box-shadow:inset 0 -4px 0 #e3a31a}
.pill.correct{background:color-mix(in srgb,var(--good) 18%,var(--card));border-color:var(--good)}
.pill.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:11px;color:var(--muted)}
.legend span{display:flex;gap:4px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--primary)}
.timer.warn{color:#d17d00}.timer.danger{color:var(--bad)}
.result{
  margin:0 0 16px;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:none
}
.result.show{display:block}
.result h2{margin:0 0 5px}.result p{margin:4px 0;opacity:.92}
.result .big{font-size:38px;font-weight:950}
.notice{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,#e3a31a 10%,var(--card));border:1px solid color-mix(in srgb,#e3a31a 35%,var(--line));font-size:13px;color:var(--muted);margin-top:12px}
.footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:11px 14px;border-radius:11px;font-weight:700;z-index:50;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:11px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div>
        <div class="title">Physiology 2018</div>
        <div class="subtitle">12 questions • Study & online Exam modes</div>
      </div>
      <div class="controls">
        <div class="mode" aria-label="Quiz mode">
          <button id="studyMode">Study</button>
          <button id="examMode">Exam</button>
        </div>
        <button class="btn" id="themeBtn" title="Toggle theme">◐ Theme</button>
        <button class="btn" id="fullBtn" title="Fullscreen">⛶ Fullscreen</button>
        <button class="btn" id="resetBtn">↻ Reset</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>Progress</span><b id="progressText">0 / 12</b><div class="progress"><i id="progressBar"></i></div></div>
      <div class="stat"><span>Score</span><b id="scoreText">—</b></div>
      <div class="stat"><span>Flagged</span><b id="flagText">0</b></div>
      <div class="stat"><span>Time</span><b class="timer" id="timer">—</b></div>
    </div>
  </header>

  <section class="result" id="result">
    <div class="big" id="resultScore">0%</div>
    <h2 id="resultTitle">Exam submitted</h2>
    <p id="resultDetails"></p>
  </section>

  <div class="dashboard">
    <main class="card question-card">
      <div class="qhead">
        <div class="qnum" id="qnum"></div>
        <button class="flag" id="flagBtn">⚑ Flag question</button>
      </div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="notice" id="modeNotice"></div>
      <div class="actions">
        <div class="left">
          <button class="btn" id="prevBtn">← Previous</button>
          <button class="btn" id="nextBtn">Next →</button>
        </div>
        <div class="right">
          <button class="btn" id="clearBtn">Clear answer</button>
          <button class="btn" id="revealBtn">Show answer</button>
          <button class="btn primary" id="submitBtn">Submit exam</button>
        </div>
      </div>
    </main>

    <aside class="card palette">
      <h3>Question navigator</h3>
      <div class="grid" id="palette"></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--primary)"></i>Answered</span>
        <span><i class="dot" style="background:#e3a31a"></i>Flagged</span>
        <span><i class="dot" style="background:var(--good)"></i>Correct</span>
        <span><i class="dot" style="background:var(--bad)"></i>Wrong</span>
      </div>
      <div class="notice">Autosave is on. Your current answers, flags and mode are kept on this device.</div>
    </aside>
  </div>
  <div class="footer">Keyboard: <kbd>←</kbd>/<kbd>→</kbd> navigate • <kbd>1–5</kbd> select an option • <kbd>F</kbd> flag</div>
</div>
<div class="toast" id="toast"></div>

<script>
const quiz = {
  title: "Physiology 2018",
  questions: [["1. Choose the true statement concerning muscle contraction:",["Calcium binding to troponin initiates a structural change in tropomyosin.","Actin and myosin slide past one another due to the active contraction of actin filaments.","Tropomyosin encircles myosin, thereby blocking the interaction sites between actin and myosin.","Both statements A and B are true."],0,"Calcium binds troponin C and shifts tropomyosin away from actin's myosin-binding sites. The filaments slide because of myosin cross-bridge cycling; actin itself does not actively contract.",["This is correct: Ca2+ binding to troponin C produces the regulatory change that moves tropomyosin.","The sliding-filament concept is correct, but actin does not actively contract; myosin cross-bridge cycling generates the movement.","Tropomyosin lies along actin and covers myosin-binding sites; it does not encircle myosin.","Incorrect because statement B is worded incorrectly: actin does not actively contract."]],["2. In contracting muscle tissue, calcium ions specifically attach to:",["Tropomyosin","Troponin C","Troponin I","Troponin T"],1,"In skeletal and cardiac muscle, Ca2+ binds to the C subunit of troponin, initiating the regulatory change that permits actin-myosin interaction.",["Ca2+ does not bind tropomyosin as the primary regulatory event.","Troponin C is the calcium-binding subunit and is therefore correct.","Troponin I is the inhibitory subunit of the troponin complex.","Troponin T anchors the troponin complex to tropomyosin."]],["3. Which ions are essential for the chemical processes involved in muscle contraction?",["Sodium and potassium ions","Sodium and magnesium ions","Calcium ions, primarily released from the sarcoplasmic reticulum","Calcium ions, primarily from the extracellular fluid"],2,"For skeletal muscle contraction, the immediate activating Ca2+ signal is supplied mainly by the sarcoplasmic reticulum.",["Na+ and K+ are essential for membrane excitability, but they are not the ion that directly activates the contractile regulatory proteins.","Na+ and Mg2+ are not the primary pair responsible for initiating cross-bridge activation.","This is correct for skeletal muscle: Ca2+ is released mainly from the sarcoplasmic reticulum.","Extracellular Ca2+ is important in some muscle types, especially cardiac and smooth muscle, but it is not the major immediate source in skeletal muscle."]],["4. Identify the function that is NOT a primary role of skeletal muscle tissue:",["Facilitating bodily movements like walking.","Sustaining posture while standing.","Generating heat to maintain body temperature.","Propelling substances through hollow visceral organs (e.g., heart, stomach).","All the listed options are major functions."],3,"Propelling substances through hollow visceral organs is primarily a function of cardiac and smooth muscle, not skeletal muscle.",["Skeletal muscle produces voluntary movement.","Continuous skeletal muscle activity contributes to posture.","Skeletal muscle contributes substantially to heat production.","This is the exception: movement of contents through hollow viscera is performed mainly by smooth muscle; the heart is cardiac muscle.","Incorrect because option D is not a primary skeletal-muscle function."]],["5. The release of acetylcholine into the synaptic cleft is triggered by the influx of which specific ion into the motor neuron's axon terminal?",["H+","K+","Na+","Ca++","Cl-"],3,"An arriving action potential opens voltage-gated Ca2+ channels at the motor nerve terminal. Ca2+ entry triggers synaptic-vesicle fusion and acetylcholine release.",["H+ influx is not the trigger for acetylcholine vesicle release.","K+ movement contributes to membrane electrical behavior but does not trigger vesicle exocytosis.","Na+ influx generates the action potential but does not directly trigger vesicle fusion.","Ca2+ influx is the immediate trigger for acetylcholine release.","Cl- is not the ion that triggers acetylcholine exocytosis."]],["6. Which statement accurately describes thick myofilaments?",["They are composed of actin, troponin, and tropomyosin proteins.","They constitute the I band of the sarcomere.","They extend across the entire length of a single sarcomere.","They contain specific binding sites for calcium ions.","They possess myosin heads that execute the power stroke."],4,"Thick filaments are composed mainly of myosin. Myosin heads bind actin, hydrolyze ATP and generate the power stroke.",["Actin, troponin and tropomyosin are components associated with thin filaments.","The I band contains thin filaments and no thick filament overlap in the idealized sarcomere diagram.","Thick filaments occupy the central region of the sarcomere and do not span the entire sarcomere.","The key Ca2+ regulatory binding site is on troponin C, not on the thick filament.","Myosin heads are part of thick filaments and perform cross-bridge cycling and the power stroke."]],["7. Identify the statement that is FALSE regarding the relaxation phase of skeletal muscle:",["Calcium ions are actively transported back into the sarcoplasmic reticulum.","The concentration of calcium ions increases within the sarcoplasm.","The myosin head binds ATP and releases its attachment to actin.","Tropomyosin shifts to cover the active binding sites on the actin filament.","All the statements provided are true."],1,"Relaxation requires cytosolic Ca2+ to fall, mainly through reuptake into the sarcoplasmic reticulum. Therefore an increase in sarcoplasmic Ca2+ is false.",["SERCA pumps actively return Ca2+ to the sarcoplasmic reticulum.","This is false: cytosolic/sarcoplasmic Ca2+ decreases during relaxation.","ATP binding to myosin reduces its affinity for actin and permits detachment.","When Ca2+ falls, tropomyosin again covers the myosin-binding sites on actin.","Incorrect because statement B is false."]],["8. What is the primary role of tropomyosin in skeletal muscle?",["It slides over actin filaments to cause muscle shortening.","It is responsible for releasing calcium once a contraction is initiated.","It binds directly to myosin during the contraction cycle.","It acts as an inhibitory protein during rest by masking the myosin-binding sites on actin.","It generates the ATP necessary for the contractile machinery to function."],3,"At rest, tropomyosin blocks the myosin-binding sites on actin. Ca2+-troponin interaction moves the regulatory complex and exposes those sites.",["Tropomyosin does not produce filament sliding.","Ca2+ release is controlled by excitation-contraction coupling and the sarcoplasmic reticulum, not by tropomyosin.","Tropomyosin is associated with actin and the troponin complex rather than acting as a myosin-binding motor protein.","This is correct: tropomyosin inhibits actin-myosin interaction at rest by covering the binding sites.","ATP is generated by metabolic pathways; tropomyosin does not synthesize ATP."]],["9. Which one of the following is the correct binding site of Ca2+?",["Actin","Troponin I","Tropomyosin C","Myosin","None of the above"],4,"The physiologic calcium-binding site in the troponin complex is troponin C. That protein is not listed; option C says 'Tropomyosin C,' which is not the correct protein name. Therefore, as written, E is the best answer.",["Ca2+ does not bind actin as the primary regulatory mechanism.","Troponin I is the inhibitory subunit; Ca2+ binds troponin C.","The source option appears to contain a naming error: the calcium-binding protein is troponin C, not 'tropomyosin C'.","Myosin does not provide the primary regulatory Ca2+ binding site in skeletal muscle.","Correct as written: troponin C is absent from A-D, so 'None of the above' is the defensible answer."]],["10. Which statement provides true information regarding the molecular architecture of myofilaments?",["Tropomyosin contains the specific binding sites for calcium.","Myosin heads are designed to attach to active sites located on G actin molecules.","The enzyme ATPase is located on the troponin complex.","Troponin attaches to the tail (rod) region of the myosin molecule.","Actin molecules contain a hinge region that flexes and extends during contraction."],1,"Myosin heads bind exposed active sites on G-actin during cross-bridge formation. The ATPase activity is associated with myosin heads.",["The regulatory Ca2+ binding site is on troponin C, not tropomyosin.","This is correct: myosin heads interact with active sites on G-actin.","Myosin, not troponin, contains the ATPase responsible for ATP hydrolysis during cross-bridge cycling.","Troponin is attached to the thin filament/tropomyosin complex, not the myosin tail.","The characteristic hinge/flexible neck region is associated with myosin; this statement is not correct for actin."]],["11. The sequence of events known as excitation-contraction coupling includes all of the following EXCEPT:",["The creation of an endplate potential at the neuromuscular junction.","The dissociation (release) of calcium ions from troponin.","The establishment of cross-bridges between actin and myosin filaments.","The enzymatic breakdown of ATP into ADP."],1,"Excitation-contraction coupling leads to Ca2+ binding to troponin, not dissociation of Ca2+ from troponin. Ca2+ dissociation occurs as part of relaxation.",["Endplate potential generation is an early step at the neuromuscular junction.","This is the exception: Ca2+ binds troponin C to initiate contraction; its dissociation is associated with relaxation.","Cross-bridge formation follows exposure of actin's myosin-binding sites.","ATP hydrolysis supplies energy for cross-bridge cycling."]],["12. Where is the troponin complex physically located within the muscle contractile apparatus?",["It is affixed to the myosin filament.","It is affixed to the tropomyosin molecule.","It is affixed to the myosin cross-bridges.","It is affixed to the T-tubules."],1,"Troponin is part of the thin filament regulatory complex and is associated with tropomyosin along the actin filament.",["Troponin is not attached to the myosin filament.","This is correct: troponin is associated with tropomyosin on the thin filament.","Myosin cross-bridges are part of the thick filament and do not carry troponin.","T-tubules conduct the action potential but do not anchor the troponin complex."]]],
  yearKey: "2018"
};

const LETTERS=["A","B","C","D","E"];
const STORE="physiology_quiz_"+quiz.yearKey;
const EXAM_MINUTES=25;

let state={
  mode:"study", index:0, answers:Array(quiz.questions.length).fill(null),
  flags:Array(quiz.questions.length).fill(false), submitted:false,
  startedAt:null, remaining:EXAM_MINUTES*60, theme:"dark"
};

const $=id=>document.getElementById(id);
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function load(){
  try{
    const raw=localStorage.getItem(STORE);
    if(raw){
      const s=JSON.parse(raw);
      if(s && Array.isArray(s.answers) && s.answers.length===quiz.questions.length) state={...state,...s};
    }
  }catch(e){}
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove("show"),1700);
}
function setTheme(){
  document.documentElement.dataset.theme=state.theme==="dark"?"dark":"light";
  $("themeBtn").textContent=state.theme==="dark"?"☀ Light":"◐ Theme";
}
function formatTime(sec){
  sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60),s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function answeredCount(){return state.answers.filter(x=>x!==null).length}
function flaggedCount(){return state.flags.filter(Boolean).length}
function score(){
  let n=0; state.answers.forEach((a,i)=>{if(a===quiz.questions[i][2])n++}); return n;
}
function renderStats(){
  const a=answeredCount(), n=quiz.questions.length;
  $("progressText").textContent=`${a} / ${n}`;
  $("progressBar").style.width=(a/n*100)+"%";
  $("flagText").textContent=flaggedCount();
  $("scoreText").textContent=state.submitted?`${score()} / ${n}`:"—";
  if(state.mode==="exam" && !state.submitted){
    $("timer").textContent=formatTime(state.remaining);
    $("timer").className="timer"+(state.remaining<=120?" danger":state.remaining<=300?" warn":"");
  }else $("timer").textContent="—";
}
function renderPalette(){
  const p=$("palette"); p.innerHTML="";
  quiz.questions.forEach((q,i)=>{
    const b=document.createElement("button"); b.className="pill";
    if(i===state.index)b.classList.add("current");
    if(state.answers[i]!==null)b.classList.add("answered");
    if(state.flags[i])b.classList.add("flagged");
    if(state.submitted){
      if(state.answers[i]===q[2])b.classList.add("correct"); else b.classList.add("wrong");
    }
    b.textContent=i+1; b.onclick=()=>{state.index=i;save();render()};
    p.appendChild(b);
  });
}
function optionButton(text,i,q){
  const b=document.createElement("button"); b.className="option";
  if(state.answers[state.index]===i)b.classList.add("selected");
  const letter=document.createElement("span"); letter.className="letter"; letter.textContent=LETTERS[i];
  const txt=document.createElement("span"); txt.className="txt"; txt.textContent=text;
  b.append(letter,txt);
  if(state.submitted){
    if(i===q[2])b.classList.add("correct");
    if(state.answers[state.index]===i && i!==q[2])b.classList.add("wrong");
  }else if(state.mode==="study" && state.answers[state.index]!==null){
    if(i===q[2])b.classList.add("correct");
    if(state.answers[state.index]===i && i!==q[2])b.classList.add("wrong");
  }
  b.onclick=()=>choose(i);
  return b;
}
function renderFeedback(force=false){
  const q=quiz.questions[state.index], selected=state.answers[state.index];
  const visible=state.submitted || (state.mode==="study" && selected!==null) || force;
  const box=$("feedback");
  if(!visible){box.classList.remove("show");box.innerHTML="";return}
  const ok=selected===q[2];
  let h=`<h3>${state.submitted ? (ok?"✓ Correct":"✕ Review this question") : (ok?"✓ Correct":"✕ Not quite")}</h3>`;
  h+=`<div class="answer-line">Correct answer: ${LETTERS[q[2]]}. ${htmlEscape(q[1][q[2]])}</div>`;
  h+=`<div style="margin-bottom:8px;line-height:1.55">${htmlEscape(q[3])}</div>`;
  q[4].forEach((e,i)=>{
    h+=`<div class="exp"><b>${LETTERS[i]}.</b> ${htmlEscape(e)} ${i===q[2]?"<strong class='explain-good'>✓ Correct</strong>":""}</div>`;
  });
  box.innerHTML=h; box.classList.add("show");
}
function htmlEscape(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
  const q=quiz.questions[state.index];
  $("qnum").textContent=`Question ${state.index+1} of ${quiz.questions.length}`;
  $("question").textContent=q[0];
  $("options").innerHTML="";
  q[1].forEach((o,i)=>$("options").appendChild(optionButton(o,i,q)));
  $("flagBtn").classList.toggle("on",!!state.flags[state.index]);
  $("flagBtn").textContent=state.flags[state.index]?"⚑ Flagged":"⚑ Flag question";
  $("studyMode").classList.toggle("active",state.mode==="study");
  $("examMode").classList.toggle("active",state.mode==="exam");
  $("clearBtn").disabled=state.answers[state.index]===null || state.submitted;
  $("revealBtn").disabled=state.mode==="exam" && !state.submitted;
  $("submitBtn").style.display=state.mode==="exam" && !state.submitted?"inline-block":"none";
  $("modeNotice").textContent=state.mode==="exam"
    ? (state.submitted?"Exam submitted. Answers and explanations are now visible.":"Exam mode: answer keys and explanations stay hidden until submission. Timer and autosave are active.")
    : "Study mode: tap an option to see the answer and full explanation immediately.";
  renderFeedback();
  renderStats(); renderPalette(); setTheme();
}
function choose(i){
  if(state.submitted)return;
  state.answers[state.index]=i; save(); render();
}
function clearAnswer(){
  if(state.submitted)return; state.answers[state.index]=null; save(); render();
}
function reveal(){
  if(state.mode==="exam" && !state.submitted)return;
  renderFeedback(true);
}
function setMode(mode){
  if(state.mode===mode)return;
  if(state.mode==="exam" && !state.submitted){
    if(!confirm("Switching modes will reset this attempt. Continue?"))return;
    reset(false);
  }
  state.mode=mode; state.submitted=false;
  state.startedAt=mode==="exam"?Date.now():null;
  state.remaining=EXAM_MINUTES*60;
  save(); render();
  toast(mode==="exam"?"Exam started — timer running":"Study mode enabled");
}
function submitExam(){
  if(state.submitted)return;
  const unanswered=quiz.questions.length-answeredCount();
  if(unanswered>0 && !confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`))return;
  state.submitted=true; state.startedAt=null; save(); render();
  const pct=Math.round(score()/quiz.questions.length*100);
  $("result").classList.add("show");
  $("resultScore").textContent=pct+"%";
  $("resultTitle").textContent=pct>=80?"Excellent performance":pct>=60?"Good work":"Keep reviewing";
  $("resultDetails").textContent=`${score()} correct out of ${quiz.questions.length}. ${flaggedCount()} flagged question(s).`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function reset(ask=true){
  if(ask && !confirm("Reset this quiz and clear the saved attempt?"))return;
  state={mode:"study",index:0,answers:Array(quiz.questions.length).fill(null),flags:Array(quiz.questions.length).fill(false),submitted:false,startedAt:null,remaining:EXAM_MINUTES*60,theme:state.theme||"dark"};
  localStorage.removeItem(STORE); $("result").classList.remove("show"); save(); render(); toast("Quiz reset");
}
function tick(){
  if(state.mode==="exam" && !state.submitted && state.startedAt){
    const elapsed=Math.floor((Date.now()-state.startedAt)/1000);
    state.remaining=Math.max(0,EXAM_MINUTES*60-elapsed); save(); renderStats();
    if(state.remaining<=0){toast("Time is up — submitting exam");submitExam()}
  }
}
$("prevBtn").onclick=()=>{if(state.index>0){state.index--;save();render()}};
$("nextBtn").onclick=()=>{if(state.index<quiz.questions.length-1){state.index++;save();render()}};
$("clearBtn").onclick=clearAnswer;
$("revealBtn").onclick=reveal;
$("submitBtn").onclick=submitExam;
$("flagBtn").onclick=()=>{state.flags[state.index]=!state.flags[state.index];save();render()};
$("studyMode").onclick=()=>setMode("study");
$("examMode").onclick=()=>setMode("exam");
$("resetBtn").onclick=()=>reset(true);
$("themeBtn").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";save();setTheme()};
$("fullBtn").onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;
  if(e.key==="ArrowRight")$("nextBtn").click();
  if(e.key==="ArrowLeft")$("prevBtn").click();
  if(e.key.toLowerCase()==="f")$("flagBtn").click();
  if(/^[1-5]$/.test(e.key)){const i=+e.key-1;if(i<quiz.questions[state.index][1].length)choose(i)}
});
load(); setTheme(); render(); setInterval(tick,1000);
</script>
</body>
</html>
