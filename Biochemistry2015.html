<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Biochemistry 2015</title>
<style>
:root{
  --bg:#0c1220; --card:#151d2d; --text:#eef3ff; --muted:#a9b3c6; --line:#2a3549;
  --primary:#2857d9; --primary2:#6d4cff; --good:#138a55; --bad:#c7354e;
  --shadow:0 14px 38px rgba(19,31,55,.10); --radius:18px;
}
[data-theme="dark"]{
  --bg:#0c1220; --card:#151d2d; --text:#eef3ff; --muted:#a9b3c6; --line:#2a3549;
  --primary:#6d8cff; --primary2:#9a7cff; --good:#43c88b; --bad:#ff6d84;
  --shadow:0 18px 48px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#080d18,#0c1220 55%,#10182a); color:var(--text);
}
[data-theme="dark"] body{background:var(--bg)}
button{font:inherit}
.app{max-width:1180px;margin:0 auto;padding:18px}
/* topbar now only has brand and title */
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px
}
.brand{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.title{font-size:clamp(20px,4vw,30px);font-weight:850;letter-spacing:-.03em}
.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:12px;
  cursor:pointer;font-weight:700;transition:.18s transform,.18s box-shadow,.18s background
}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(40,87,217,.12)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}
.btn.danger{color:#fff;background:var(--bad);border:0}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.mode{
  display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)
}
.mode button{border:0;background:transparent;padding:9px 12px;color:var(--muted);font-weight:800;cursor:pointer}
.mode button.active{background:var(--primary);color:#fff}
/* dashboard is now a single column */
.dashboard{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* question card holds everything */
.question-card{padding:22px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}
.qnum{font-size:13px;color:var(--muted);font-weight:800}
.flag{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:800}
.flag.on{color:#fff;background:#e3a31a;border-color:#e3a31a}
.question{font-size:clamp(18px,2.6vw,24px);font-weight:800;line-height:1.42;margin-bottom:18px}
.options{display:grid;gap:11px}
.option{
  position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);
  border-radius:14px;cursor:pointer;transition:.18s ease;overflow:hidden
}
.option:hover{border-color:var(--primary);transform:translateY(-1px)}
.option.selected{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent),0 0 24px color-mix(in srgb,var(--primary) 18%,transparent)}
.option.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 15%,transparent)}
.option.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.letter{width:30px;height:30px;display:grid;place-items:center;flex:0 0 30px;border-radius:9px;background:var(--bg);font-weight:900}
.option .txt{line-height:1.45}
.feedback{margin-top:17px;padding:16px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--primary) 5%,var(--card));display:none}
.feedback.show{display:block}
.feedback h3{margin:0 0 8px;font-size:16px}
.answer-line{font-weight:900;margin-bottom:10px}
.exp{padding:9px 0;border-top:1px dashed var(--line);line-height:1.5;font-size:14px}
.exp b{display:inline-block;min-width:26px}
.explain-good{color:var(--good)} .explain-bad{color:var(--bad)}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions .left,.actions .right{display:flex;gap:8px;flex-wrap:wrap}
/* bottom panel wrapper for stats and palette */
.bottom-panel{
  margin-top:24px;
  padding-top:16px;
  border-top:1px solid var(--line);
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  align-items:flex-start;
  justify-content:space-between;
}
.stats{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  flex:2 1 360px;
}
.stat{
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:color-mix(in srgb,var(--card) 92%,var(--primary) 8%);
  display:flex;
  align-items:center;
  gap:8px;
  flex:1 1 auto;
  min-width:110px;
}
.stat b{font-size:16px}
.stat span{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px;width:60px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0;transition:.3s}
/* mini controls inside bottom panel */
.mini-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini-controls .btn{padding:5px 9px;font-size:12px;border-radius:9px}
.palette-mini{
  flex:1 1 240px;
  background:color-mix(in srgb,var(--card) 96%,var(--primary) 4%);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
}
.palette-mini h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pill{
  aspect-ratio:1;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:7px;font-weight:800;font-size:12px;cursor:pointer
}
.pill.current{outline:3px solid color-mix(in srgb,var(--primary) 25%,transparent);border-color:var(--primary)}
.pill.answered{background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.pill.flagged{box-shadow:inset 0 -3px 0 #e3a31a}
.pill.correct{background:color-mix(in srgb,var(--good) 18%,var(--card));border-color:var(--good)}
.pill.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}
.legend span{display:flex;gap:3px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--primary)}
.timer.warn{color:#d17d00}.timer.danger{color:var(--bad)}
.result{
  margin:0 0 16px;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:none
}
.result.show{display:block}
.result h2{margin:0 0 5px}.result p{margin:4px 0;opacity:.92}
.result .big{font-size:38px;font-weight:950}
.notice{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,#e3a31a 10%,var(--card));border:1px solid color-mix(in srgb,#e3a31a 35%,var(--line));font-size:12px;color:var(--muted);margin-top:12px}
.footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:11px 14px;border-radius:11px;font-weight:700;z-index:50;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:11px}
/* responsive */
@media(max-width:650px){
  .bottom-panel{flex-direction:column}
  .stats{width:100%}
  .palette-mini{width:100%}
  .stat{min-width:80px;padding:6px 8px}
  .stat b{font-size:14px}
  .grid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div>
        <div class="title">Biochemistry 2015</div>
        <div class="subtitle">Interactive MCQ • 24 questions • Study & online Exam modes</div>
      </div>
    </div>
  </header>

  <section class="result" id="result">
    <div class="big" id="resultScore">0%</div>
    <h2 id="resultTitle">Exam submitted</h2>
    <p id="resultDetails"></p>
  </section>

  <div class="dashboard">
    <main class="card question-card">
      <div class="qhead">
        <div class="qnum" id="qnum"></div>
        <button class="flag" id="flagBtn">⚑ Flag question</button>
      </div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="notice" id="modeNotice"></div>
      <div class="actions">
        <div class="left">
          <button class="btn" id="prevBtn">← Previous</button>
          <button class="btn" id="nextBtn">Next →</button>
        </div>
        <div class="right">
          <button class="btn" id="clearBtn">Clear answer</button>
          <button class="btn" id="revealBtn">Show answer</button>
          <button class="btn primary" id="submitBtn">Submit exam</button>
        </div>
      </div>

      <!-- ===== MOVED: session overview + palette now at bottom of each question ===== -->
      <div class="bottom-panel">
        <div class="stats">
          <div class="stat"><span>Progress</span><b id="progressText">0 / 24</b><div class="progress"><i id="progressBar"></i></div></div>
          <div class="stat"><span>Score</span><b id="scoreText">—</b></div>
          <div class="stat"><span>Flagged</span><b id="flagText">0</b></div>
          <div class="stat"><span>Time</span><b class="timer" id="timer">—</b></div>
        </div>
        <div class="mini-controls">
          <div class="mode" aria-label="Quiz mode">
            <button id="studyMode">Study</button>
            <button id="examMode">Exam</button>
          </div>
          <button class="btn" id="themeBtn" title="Toggle theme">◐</button>
          <button class="btn" id="fullBtn" title="Fullscreen">⛶</button>
          <button class="btn" id="resetBtn">↻</button>
        </div>
        <div class="palette-mini">
          <h3>Navigator</h3>
          <div class="grid" id="palette"></div>
          <div class="legend">
            <span><i class="dot" style="background:var(--primary)"></i>Ans</span>
            <span><i class="dot" style="background:#e3a31a"></i>Flag</span>
            <span><i class="dot" style="background:var(--good)"></i>✓</span>
            <span><i class="dot" style="background:var(--bad)"></i>✗</span>
          </div>
        </div>
      </div>
      <!-- ===== end moved panel ===== -->

    </main>
  </div>
  <div class="footer">Keyboard: <kbd>←</kbd>/<kbd>→</kbd> navigate • <kbd>1–4</kbd> select an option • <kbd>F</kbd> flag</div>
</div>
<div class="toast" id="toast"></div>

<script>
const quiz = {
  title: "Biochemistry 2015",
  questions: [["Which of the following statements incorrectly describes an aspect of slow-twitch muscle tissues?",["They provide relatively low tension but is highly resistant to fatigue","They produce ATP by the relatively slow but steady process of phosphorylation.","During active state, they use ATP faster than it should be replaced.","All except A"],2,"Slow-twitch fibers are fatigue resistant and rely on sustained oxidative ATP production; their ATP supply generally keeps pace with demand during prolonged activity.",["This accurately describes type I fibers.","This describes their reliance on oxidative phosphorylation.","This is incorrect because sustained oxidative fibers are adapted to replenish ATP continuously.","This is not the best single answer because B is correct and C is the specific incorrect statement."]],["_____ is used as the energy fuels for muscle contraction during vigorous exercises.",["Blood glucose","Glycogen","Ketone bodies","All of the above"],3,"The question is broadly phrased. Blood glucose, glycogen-derived glucose and ketone bodies can all be oxidized by muscle, although muscle glycogen and blood glucose are the major rapid fuels during vigorous exercise.",["Blood glucose is an immediately available circulating carbohydrate fuel.","Muscle glycogen is a major rapid source during vigorous exercise.","Muscle can oxidize ketone bodies, especially in fasting/prolonged exercise, although they are not the dominant acute high-intensity fuel.","Under the broad wording of the question, all listed substrates can serve as energy fuels."]],["What are the key lab features in osteomalacia?",["Normal serum calcium, normal serum phosphate, normal PTH","↑ serum calcium, ↓ serum phosphate, ↑ PTH","↓ serum calcium, ↓ serum phosphate, normal PTH","↓ serum calcium, ↓ serum phosphate, ↑ PTH","Calcium homeostasis imbalance"],3,"Nutritional osteomalacia commonly shows low/low-normal calcium, low phosphate and elevated PTH from secondary hyperparathyroidism.",["Normal calcium, phosphate and PTH do not fit the usual active disorder.","High serum calcium is not typical of nutritional osteomalacia.","PTH is generally elevated as compensation.","This is the classic pattern among the listed choices.","This is too nonspecific to be the best laboratory pattern."]],["What is the major cause of muscle fatigue?",["Lactate accumulation","Excess storage of glycogen","Formation of pyruvic acid","Calcium homeostasis imbalance"],3,"Modern physiology views fatigue as multifactorial. Disturbed excitation-contraction coupling and altered intracellular calcium handling can contribute strongly; lactate itself is not the sole cause.",["Lactate accumulation accompanies intense exercise but is not by itself the major direct cause of fatigue.","Excess glycogen storage does not cause ordinary acute muscle fatigue.","Pyruvate is a normal metabolic intermediate and its formation is not itself the main cause of fatigue.","Disruption of calcium handling and excitation-contraction coupling can impair force generation and is a major contributor."]],["Which of the following statements correctly describes the effect of PTH on phosphorus homeostasis?",["It causes the release of phosphorus from bone","It influences the kidney to decrease phosphorus excretion","It counteracts the effect of calcitonin to regulate phosphorus level","A & C are correct"],3,"PTH mobilizes phosphate from bone and, importantly, decreases renal phosphate reabsorption, increasing phosphate excretion. Thus A is true and B is false; within the exam's intended framing, A and C are the correct pair.",["PTH increases bone resorption, releasing phosphate along with calcium.","PTH actually increases renal phosphate excretion by reducing proximal tubular phosphate reabsorption.","PTH generally opposes calcitonin's calcium/phosphate-lowering effects in overall mineral homeostasis.","A and C are the intended correct statements."]],["Which of the following hormone is considered as specific marker of osteoblast function, as its levels correlate with the bone formation rate?",["Parathyroid hormone","Osteocalcin","Thyroid hormone","Calcitonin"],1,"Osteocalcin is synthesized by osteoblasts and correlates with bone formation activity.",["PTH is a regulator of mineral homeostasis, not a specific osteoblast marker.","Osteocalcin is an osteoblast-derived bone matrix protein and marker of bone formation.","Thyroid hormone affects bone turnover but is not specific to osteoblast function.","Calcitonin inhibits osteoclast activity rather than serving as a specific osteoblast marker."]],["What is the primary function of creatine phosphate in muscle metabolism?",["To provide energy for muscle contraction","To break down excess glucose","To regulate electrolyte balance","To repair muscle tissue"],0,"Phosphocreatine rapidly regenerates ATP from ADP through creatine kinase, supporting the first seconds of high-intensity muscle work.",["This is the primary function of phosphocreatine.","Glycolysis and related pathways break down glucose.","Electrolyte balance is controlled by ion transport and hormonal/renal mechanisms.","Phosphocreatine is not primarily involved in tissue repair."]],["Which of the following is a risk factor for osteoporosis?",["Male gender","Female gender","Hormone replacement therapy","Overproduction of parathyroid hormone"],1,"Female sex, particularly after menopause with estrogen deficiency, is a major osteoporosis risk factor.",["Male sex is generally lower risk than female sex, although men can develop osteoporosis.","Female sex is a major risk factor, especially after menopause.","Appropriate hormone replacement can reduce postmenopausal bone loss rather than being a general risk factor.","Excess PTH can promote bone resorption and contribute to bone loss, so this can also be a risk, but the exam's best answer is female gender."]],["Which hormone plays a role in bone remodeling?",["Insulin","Parathyroid hormone","Adrenalin","Thyroid hormone"],1,"PTH is a major endocrine regulator of bone remodeling.",["Insulin affects bone metabolism but is not the classic main regulator in this question.","PTH regulates bone turnover and can stimulate resorption through osteoblast-mediated signaling.","Adrenaline is not the primary endocrine regulator of bone remodeling.","Thyroid hormone affects turnover, but PTH is the best answer here."]],["Which hormone stimulates bone growth and development during childhood?",["Calcitonin","Parathyroid hormone","Estrogen","Growth hormone"],3,"Growth hormone, largely through IGF-1, promotes longitudinal bone growth and skeletal development in childhood.",["Calcitonin mainly reduces osteoclast activity and is not the main childhood growth hormone.","PTH regulates mineral homeostasis and remodeling rather than being the primary growth hormone.","Estrogen contributes to pubertal growth and epiphyseal maturation, but GH/IGF-1 is the major growth-promoting axis.","Growth hormone stimulates IGF-1 production and supports chondrocyte and osteoblast activity during growth."]],["Which hormone plays a role in regulating calcium levels in the blood?",["Calcitonin","Parathyroid hormone","Estrogen","Growth hormone"],1,"PTH is the major physiological regulator of extracellular calcium.",["Calcitonin lowers calcium and participates in calcium regulation, but PTH is the dominant regulator.","PTH raises serum calcium through renal, bone and vitamin-D-mediated effects.","Estrogen affects bone turnover but is not the main acute calcium regulator.","Growth hormone has secondary effects on bone but is not the principal calcium-regulating hormone."]],["Which hormone is responsible for inhibiting osteoclast activity?",["Calcitonin","Growth hormone","Parathyroid hormone","Estrogen"],0,"Calcitonin directly inhibits osteoclasts and reduces bone resorption.",["Calcitonin is the classic direct inhibitor of osteoclast activity.","Growth hormone does not directly inhibit osteoclasts as its main action.","PTH generally promotes osteoclast-mediated resorption indirectly when persistently elevated.","Estrogen suppresses osteoclast formation/activity, but calcitonin is the direct classic answer."]],["What types of cells are involved in bone remodeling?",["Osteoclasts and chondrocytes","Osteoblasts and chondrocytes","Osteoclasts and osteoblasts","Chondrocytes and hematopoietic stem cells"],2,"Bone remodeling couples osteoclast-mediated resorption with osteoblast-mediated formation.",["Chondrocytes are central to cartilage, especially growth plates, not the main paired remodeling cells.","Osteoblasts are involved, but chondrocytes are not the principal remodeling partner.","Osteoclasts resorb bone and osteoblasts form bone, making them the key remodeling pair.","Hematopoietic stem cells are progenitors for osteoclast lineage, but they are not the active remodeling pair."]],["Which hormone is responsible for stimulating bone resorption?",["Calcitonin","Parathyroid hormone","Glucagon","Erythropoietin"],1,"PTH stimulates osteoblasts to increase RANKL signaling, thereby increasing osteoclast formation and bone resorption.",["Calcitonin inhibits osteoclast activity and bone resorption.","PTH increases bone resorption, particularly when chronically elevated.","Glucagon primarily regulates glucose metabolism and is not the classic bone-resorbing hormone.","Erythropoietin regulates erythropoiesis rather than directly stimulating bone resorption."]],["Collagen biosynthesis occurs in which cellular compartment?",["Cytoplasm","Nucleus","Endoplasmic reticulum","Mitochondria"],2,"Collagen polypeptide synthesis and much of procollagen processing occur in the rough endoplasmic reticulum before Golgi and extracellular maturation.",["Ribosomes in the cytosol synthesize many proteins, but collagen's secretory-pathway synthesis occurs on rough-ER-bound ribosomes.","The nucleus stores DNA and carries out transcription, not collagen polypeptide synthesis.","The rough ER is the key site for synthesis, hydroxylation and early assembly of procollagen.","Mitochondria are not the site of collagen biosynthesis."]],["Which element is required to aid vitamin C for optimal collagen biosynthesis?",["Calcium","Magnesium","Iron","Phosphorus"],2,"Iron is required by prolyl and lysyl hydroxylases; vitamin C keeps the catalytic iron in the reduced state.",["Calcium is important for mineralized tissue but is not the collagen hydroxylase cofactor.","Magnesium is not the key metal for prolyl/lysyl hydroxylation.","Iron is the essential metal cofactor for collagen hydroxylases.","Phosphorus is important for energy and mineral metabolism, not the vitamin-C-dependent hydroxylation step."]],["Which enzyme is responsible for cleavage of collagen triple helix during tissue remodeling?",["Elastase","Collagenase","Peptidase","Lipase"],1,"Collagenase, including collagen-degrading matrix metalloproteinases, cleaves native collagen during tissue remodeling.",["Elastase mainly degrades elastin.","Collagenase is the classic enzyme responsible for cleavage of native collagen.","Peptidases broadly hydrolyze peptide bonds but are not the specific answer for native collagen triple-helix cleavage.","Lipase acts on lipids."]],["Which of the following is a regulatory protein that modulates collagen biosynthesis?",["Fibroblast growth factor","Transforming growth factor beta","Insulin-like growth factor","Platelet-derived growth factor"],1,"Transforming growth factor beta (TGF-β) is a major regulator of extracellular-matrix and collagen synthesis, especially in fibroblasts.",["FGFs mainly regulate proliferation, differentiation and repair; some can affect matrix production but are not the classic answer.","TGF-β strongly stimulates extracellular-matrix and collagen synthesis and is a key fibrosis/remodeling regulator.","IGFs promote growth and anabolic responses but are not the principal regulator of collagen biosynthesis here.","PDGF promotes fibroblast proliferation and repair and can influence collagen, but TGF-β is the classic direct matrix regulator."]],["Which of the following is a common post-translational modification of collagen?",["Phosphorylation","Glycosylation","Methylation","Acetylation"],1,"Hydroxylysine residues in procollagen can undergo glycosylation during collagen processing.",["Phosphorylation is not the characteristic collagen modification tested here.","Glycosylation of hydroxylysine residues is a recognized collagen post-translational modification.","Methylation is not the classic modification in collagen maturation.","Acetylation is not the characteristic collagen processing modification tested here."]],["Which of the following is NOT a source of collagen for biomedical applications?",["Animal tissues","Plant extracts","Recombinant proteins","Synthetic peptides"],3,"Synthetic peptides can mimic collagen sequences and are useful biomaterials, but they are not a conventional source of native collagen itself.",["Animal tissues are traditional sources of collagen, such as bovine or porcine tissues.","Plant extracts do not contain native animal collagen; some plant-derived materials are used as scaffolds or collagen-like alternatives, but the exam lists them as a source.","Recombinant systems can produce collagen or collagen-like proteins.","Synthetic peptides are engineered collagen-mimetic materials rather than a source of native collagen."]],["Which enzyme is responsible for crosslinking of collagen fibers?",["Lysyl oxidase","Tyrosinase","Peptidyl-transferase","Glutathione peroxidase"],0,"Lysyl oxidase catalyzes oxidative deamination of lysine/hydroxylysine residues, enabling covalent collagen cross-links.",["Lysyl oxidase is the key enzyme in collagen cross-link formation.","Tyrosinase participates mainly in melanin synthesis.","Peptidyl-transferase forms peptide bonds during protein synthesis.","Glutathione peroxidase removes peroxides and protects against oxidative stress."]],["Which type of collagen is found primarily in basement membranes?",["Type I","Type II","Type III","Type IV"],3,"Type IV collagen forms a network and is the major collagen of basement membranes.",["Type I is abundant in bone, tendon, skin and other connective tissues.","Type II is characteristic of cartilage.","Type III is reticular collagen in tissues such as vessels and stroma.","Type IV is the network-forming collagen of basement membranes."]],["Which type of collagen is found primarily in blood vessels?",["Type I","Type II","Type III","Type IV"],2,"Type III collagen is prominent in reticular fibers and is abundant in vessel walls and other extensible tissues.",["Type I is abundant in bone, tendon and skin but is not the best answer for vessel walls.","Type II is primarily cartilage collagen.","Type III is prominent in blood vessels and reticular connective tissue.","Type IV forms basement membranes rather than the main fibrillar collagen of vessel walls."]],["Which of the following is a disorder caused by defects in collagen processing?",["Scurvy","Osteogenesis imperfecta","Ehlers-Danlos syndrome","Marfan syndrome"],2,"Ehlers-Danlos syndromes include disorders involving collagen synthesis, processing or extracellular-matrix proteins.",["Scurvy is acquired vitamin C deficiency that impairs collagen hydroxylation.","Osteogenesis imperfecta is mainly caused by type I collagen structural/synthesis defects.","Ehlers-Danlos syndromes include inherited defects in collagen processing or structure.","Marfan syndrome is due to fibrillin-1 abnormalities, not primary collagen processing."]]],
  yearKey: "Biochemistry2015"
};

const LETTERS=["A","B","C","D","E"];
const STORE="biochem_quiz_"+quiz.yearKey;
const EXAM_MINUTES=25;

let state={
  mode:"study", index:0, answers:Array(quiz.questions.length).fill(null),
  flags:Array(quiz.questions.length).fill(false), submitted:false,
  startedAt:null, remaining:EXAM_MINUTES*60, theme:"dark"
};

const $=id=>document.getElementById(id);
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function load(){
  try{
    const raw=localStorage.getItem(STORE);
    if(raw){
      const s=JSON.parse(raw);
      if(s && Array.isArray(s.answers) && s.answers.length===quiz.questions.length) state={...state,...s};
    }
  }catch(e){}
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove("show"),1700);
}
function setTheme(){
  document.documentElement.dataset.theme=state.theme==="dark"?"dark":"light";
  $("themeBtn").textContent=state.theme==="dark"?"☀":"◐";
}
function formatTime(sec){
  sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60),s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function answeredCount(){return state.answers.filter(x=>x!==null).length}
function flaggedCount(){return state.flags.filter(Boolean).length}
function score(){
  let n=0; state.answers.forEach((a,i)=>{if(a===quiz.questions[i][2])n++}); return n;
}
function renderStats(){
  const a=answeredCount(), n=quiz.questions.length;
  $("progressText").textContent=`${a} / ${n}`;
  $("progressBar").style.width=(a/n*100)+"%";
  $("flagText").textContent=flaggedCount();
  $("scoreText").textContent=state.submitted?`${score()} / ${n}`:"—";
  if(state.mode==="exam" && !state.submitted){
    $("timer").textContent=formatTime(state.remaining);
    $("timer").className="timer"+(state.remaining<=120?" danger":state.remaining<=300?" warn":"");
  }else $("timer").textContent="—";
}
function renderPalette(){
  const p=$("palette"); p.innerHTML="";
  quiz.questions.forEach((q,i)=>{
    const b=document.createElement("button"); b.className="pill";
    if(i===state.index)b.classList.add("current");
    if(state.answers[i]!==null)b.classList.add("answered");
    if(state.flags[i])b.classList.add("flagged");
    if(state.submitted){
      if(state.answers[i]===q[2])b.classList.add("correct"); else b.classList.add("wrong");
    }
    b.textContent=i+1; b.onclick=()=>{state.index=i;save();render()};
    p.appendChild(b);
  });
}
function optionButton(text,i,q){
  const b=document.createElement("button"); b.className="option";
  if(state.answers[state.index]===i)b.classList.add("selected");
  const letter=document.createElement("span"); letter.className="letter"; letter.textContent=LETTERS[i];
  const txt=document.createElement("span"); txt.className="txt"; txt.textContent=text;
  b.append(letter,txt);
  if(state.submitted){
    if(i===q[2])b.classList.add("correct");
    if(state.answers[state.index]===i && i!==q[2])b.classList.add("wrong");
  }else if(state.mode==="study" && state.answers[state.index]!==null){
    if(i===q[2])b.classList.add("correct");
    if(state.answers[state.index]===i && i!==q[2])b.classList.add("wrong");
  }
  b.onclick=()=>choose(i);
  return b;
}
function renderFeedback(force=false){
  const q=quiz.questions[state.index], selected=state.answers[state.index];
  const visible=state.submitted || (state.mode==="study" && selected!==null) || force;
  const box=$("feedback");
  if(!visible){box.classList.remove("show");box.innerHTML="";return}
  const ok=selected===q[2];
  let h=`<h3>${state.submitted ? (ok?"✓ Correct":"✕ Review this question") : (ok?"✓ Correct":"✕ Not quite")}</h3>`;
  h+=`<div class="answer-line">Correct answer: ${LETTERS[q[2]]}. ${htmlEscape(q[1][q[2]])}</div>`;
  h+=`<div style="margin-bottom:8px;line-height:1.55">${htmlEscape(q[3])}</div>`;
  q[4].forEach((e,i)=>{
    h+=`<div class="exp"><b>${LETTERS[i]}.</b> ${htmlEscape(e)} ${i===q[2]?"<strong class='explain-good'>✓ Correct</strong>":""}</div>`;
  });
  box.innerHTML=h; box.classList.add("show");
}
function htmlEscape(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
  const q=quiz.questions[state.index];
  $("qnum").textContent=`Question ${state.index+1} of ${quiz.questions.length}`;
  $("question").textContent=q[0];
  $("options").innerHTML="";
  q[1].forEach((o,i)=>$("options").appendChild(optionButton(o,i,q)));
  $("flagBtn").classList.toggle("on",!!state.flags[state.index]);
  $("flagBtn").textContent=state.flags[state.index]?"⚑ Flagged":"⚑ Flag question";
  $("studyMode").classList.toggle("active",state.mode==="study");
  $("examMode").classList.toggle("active",state.mode==="exam");
  $("clearBtn").disabled=state.answers[state.index]===null || state.submitted;
  $("revealBtn").disabled=state.mode==="exam" && !state.submitted;
  $("submitBtn").style.display=state.mode==="exam" && !state.submitted?"inline-block":"none";
  $("modeNotice").textContent=state.mode==="exam"
    ? (state.submitted?"Exam submitted. Answers and explanations are now visible.":"Exam mode: answer keys and explanations stay hidden until submission. Timer and autosave are active.")
    : "Study mode: tap an option to see the answer and full explanation immediately.";
  renderFeedback();
  renderStats(); renderPalette(); setTheme();
}
function choose(i){
  if(state.submitted)return;
  state.answers[state.index]=i; save(); render();
}
function clearAnswer(){
  if(state.submitted)return; state.answers[state.index]=null; save(); render();
}
function reveal(){
  if(state.mode==="exam" && !state.submitted)return;
  renderFeedback(true);
}
function setMode(mode){
  if(state.mode===mode)return;
  if(state.mode==="exam" && !state.submitted){
    if(!confirm("Switching modes will reset this attempt. Continue?"))return;
    reset(false);
  }
  state.mode=mode; state.submitted=false;
  state.startedAt=mode==="exam"?Date.now():null;
  state.remaining=EXAM_MINUTES*60;
  save(); render();
  toast(mode==="exam"?"Exam started — timer running":"Study mode enabled");
}
function submitExam(){
  if(state.submitted)return;
  const unanswered=quiz.questions.length-answeredCount();
  if(unanswered>0 && !confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`))return;
  state.submitted=true; state.startedAt=null; save(); render();
  const pct=Math.round(score()/quiz.questions.length*100);
  $("result").classList.add("show");
  $("resultScore").textContent=pct+"%";
  $("resultTitle").textContent=pct>=80?"Excellent performance":pct>=60?"Good work":"Keep reviewing";
  $("resultDetails").textContent=`${score()} correct out of ${quiz.questions.length}. ${flaggedCount()} flagged question(s).`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function reset(ask=true){
  if(ask && !confirm("Reset this quiz and clear the saved attempt?"))return;
  state={mode:"study",index:0,answers:Array(quiz.questions.length).fill(null),flags:Array(quiz.questions.length).fill(false),submitted:false,startedAt:null,remaining:EXAM_MINUTES*60,theme:state.theme||"dark"};
  localStorage.removeItem(STORE); $("result").classList.remove("show"); save(); render(); toast("Quiz reset");
}
function tick(){
  if(state.mode==="exam" && !state.submitted && state.startedAt){
    const elapsed=Math.floor((Date.now()-state.startedAt)/1000);
    state.remaining=Math.max(0,EXAM_MINUTES*60-elapsed); save(); renderStats();
    if(state.remaining<=0){toast("Time is up — submitting exam");submitExam()}
  }
}
$("prevBtn").onclick=()=>{if(state.index>0){state.index--;save();render()}};
$("nextBtn").onclick=()=>{if(state.index<quiz.questions.length-1){state.index++;save();render()}};
$("clearBtn").onclick=clearAnswer;
$("revealBtn").onclick=reveal;
$("submitBtn").onclick=submitExam;
$("flagBtn").onclick=()=>{state.flags[state.index]=!state.flags[state.index];save();render()};
$("studyMode").onclick=()=>setMode("study");
$("examMode").onclick=()=>setMode("exam");
$("resetBtn").onclick=()=>reset(true);
$("themeBtn").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";save();setTheme()};
$("fullBtn").onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;
  if(e.key==="ArrowRight")$("nextBtn").click();
  if(e.key==="ArrowLeft")$("prevBtn").click();
  if(e.key.toLowerCase()==="f")$("flagBtn").click();
  if(/^[1-5]$/.test(e.key)){const i=+e.key-1;if(i<quiz.questions[state.index][1].length)choose(i)}
});
load(); setTheme(); render(); setInterval(tick,1000);
</script>
